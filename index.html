<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Albion Gathering Fame Calculator</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f7f7f5;
    color: #1a1a1a;
  }
  header {
    padding: 20px 28px 12px;
    border-bottom: 1px solid #e2e2df;
    background: #fff;
  }
  header h1 { margin: 0 0 4px; font-size: 1.4rem; }
  header p { margin: 0; color: #666; font-size: 0.9rem; }
  main {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 24px;
    padding: 24px 28px;
    max-width: 1300px;
    margin: 0 auto;
    align-items: start;
  }
  @media (max-width: 760px) {
    main {
      grid-template-columns: 1fr;
      padding: 16px;
      gap: 16px;
    }
  }
  .panel {
    background: #fff;
    border: 1px solid #e2e2df;
    border-radius: 8px;
    padding: 18px 20px;
  }
  .panel h2 { font-size: 0.95rem; margin: 0 0 14px; }

  /* --- zone selector --- */
  .zone-group + .zone-group { margin-top: 18px; }
  .zone-group-title {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #888;
    margin: 0 0 8px;
  }
  .zone-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
  }
  .zone-row label {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.87rem;
    flex: 1;
    cursor: pointer;
  }
  .zone-row .swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex: none;
    visibility: hidden;
  }
  .zone-row.checked .swatch { visibility: visible; }
  .zone-row select.quality-select {
    width: 62px;
    padding: 2px 4px;
    font-size: 0.78rem;
  }

  /* --- generic form controls --- */
  .field { margin-bottom: 14px; }
  .field label {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    margin-bottom: 4px;
    color: #333;
  }
  .field .val { font-variant-numeric: tabular-nums; color: #2563eb; font-weight: 600; }
  .field input[type="range"] { width: 100%; }
  select {
    padding: 6px 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 0.9rem;
    background: #fff;
  }
  button {
    font-family: inherit;
    cursor: pointer;
  }

  /* --- chart --- */
  svg#chart {
    width: 100%;
    height: 420px;
    background: #fff;
  }
  .gridline { stroke: #eee; stroke-width: 1; }
  .axis-line { stroke: #999; stroke-width: 1; }
  .axis-label { font-size: 10px; fill: #666; }
  .axis-title { font-size: 11px; fill: #444; font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px 18px; margin-top: 10px; font-size: 0.8rem; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }

  /* --- per-zone config cards --- */
  #zonePanels { margin-top: 20px; display: flex; flex-direction: column; gap: 14px; }
  .zone-card { border: 1px solid #e2e2df; border-radius: 8px; background: #fff; overflow: hidden; }
  .zone-card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    cursor: pointer;
    background: #fafaf9;
  }
  .zone-card-header .swatch { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .zone-card-header .name { font-weight: 600; font-size: 0.9rem; flex: 1; }
  .zone-card-header .chevron { transition: transform 0.15s; color: #888; font-size: 0.75rem; }
  .zone-card.collapsed .chevron { transform: rotate(-90deg); }
  .zone-card-body { padding: 16px; border-top: 1px solid #eee; }
  .zone-card.collapsed .zone-card-body { display: none; }
  .zone-card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
  .zone-card-reset {
    padding: 5px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #f3f3f1;
    font-size: 0.78rem;
  }
  .zone-card-reset:hover { background: #eaeae7; }
  .empty-hint { color: #888; font-size: 0.85rem; padding: 8px 0; }

  table.mini { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.78rem; }
  table.mini th, table.mini td { text-align: left; padding: 3px 8px; border-bottom: 1px solid #f0f0ee; }
  table.mini th { color: #888; font-weight: 600; }
  table.mini td:last-child, table.mini th:last-child { text-align: right; }

  footer {
    max-width: 1300px;
    margin: 0 auto;
    padding: 0 28px 32px;
    font-size: 0.8rem;
    color: #888;
  }
</style>
</head>
<body>
<header>
  <h1>Albion Gathering Fame Calculator</h1>
  <p>Fame/hour vs. minimum-value filter threshold, one line per selected zone.</p>
</header>

<main>
  <div class="panel">
    <h2>Zones</h2>
    <div id="zoneList"></div>
  </div>

  <div>
    <div class="panel">
      <svg id="chart" viewBox="0 0 800 420"></svg>
      <div class="legend" id="legend"></div>
    </div>
    <div id="zonePanels"></div>
  </div>
</main>

<footer>
  Game-data constants are fixed and not user-editable; only the four assumption parameters per zone are adjustable. See <a href="docs/spec.md">docs/spec.md</a> for the full model.
</footer>

<script type="module" src="src/app.mjs"></script>
</body>
</html>
