<!doctype html>
<html>
<head><meta charset="utf-8"><title>Z7 Q3 sanity test</title></head>
<body>
<pre id="out">running…</pre>
<script type="module">
import { ZONES, CATEGORY_DEFAULTS } from '../src/data.mjs';
import { computeZoneSweep } from '../src/model.mjs';

const EXPECTED = [
  { label: 'T5.0', famePerHour: 30688 },
  { label: 'T5.1/T6.0', famePerHour: 32046 },
  { label: 'T7.0', famePerHour: 32866 },
  { label: 'T5.2/T6.1', famePerHour: 21433 },
  { label: 'T7.1', famePerHour: 17934 },
  { label: 'T5.3/T6.2', famePerHour: 9581 },
  { label: 'T7.2', famePerHour: 7190 },
  { label: 'T6.3', famePerHour: 2838 },
  { label: 'T7.3', famePerHour: 1833 },
];
const TOLERANCE = 0.005;

const assumptions = CATEGORY_DEFAULTS.outlands;
const sweep = computeZoneSweep(ZONES.OUT_Z7, 'Q3', assumptions);

let lines = ['tau\tlabel\t\tfame/hr\t\texpected\tdiff%\tstatus'];
let failures = 0;

sweep.forEach((row, i) => {
  const exp = EXPECTED[i];
  const diffPct = exp ? ((row.famePerHour - exp.famePerHour) / exp.famePerHour) * 100 : NaN;
  const ok = exp && row.label === exp.label && Math.abs(diffPct) / 100 <= TOLERANCE;
  if (!ok) failures++;
  lines.push(
    `${row.tau}\t${row.label.padEnd(12)}\t${row.famePerHour.toFixed(1)}\t\t${exp ? exp.famePerHour : '—'}\t\t${exp ? diffPct.toFixed(2) : '—'}\t${ok ? 'OK' : 'FAIL'}`
  );
});

if (sweep.length !== EXPECTED.length) {
  lines.push(`ROW COUNT MISMATCH: got ${sweep.length}, expected ${EXPECTED.length}`);
  failures++;
}

lines.push('');
lines.push(failures === 0 ? 'ALL ROWS MATCH WITHIN TOLERANCE' : `${failures} ROW(S) FAILED`);

document.getElementById('out').textContent = lines.join('\n');
window.__testFailures = failures;
</script>
</body>
</html>
